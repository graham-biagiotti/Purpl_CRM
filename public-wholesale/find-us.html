<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to Find Us — purpl &amp; Lavender Fields</title>
<meta name="description" content="Stores across New England carrying purpl lavender lemonade and Lavender Fields farm products from Pumpkin Blossom Farm.">
<link rel="icon" href="images/favicon-32.png">
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root { --purpl:#8B5FBF; --purpl-dark:#4B2082; --lf:#4a7c59; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Georgia,'Times New Roman',serif; background:#faf9f7; color:var(--text); }
  .hdr { background:linear-gradient(135deg,#6B4F9A 0%,#9B73C4 100%); padding:36px 20px 30px; text-align:center; color:#fff; }
  .hdr .logos { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
  .hdr .logos .divider { width:1px; height:44px; background:rgba(255,255,255,.5); }
  .hdr h1 { font-size:30px; font-weight:600; letter-spacing:.5px; }
  .hdr .sub { font-family:Inter,Arial,sans-serif; font-size:14px; opacity:.92; margin-top:8px; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px 60px; }
  .chips { display:flex; justify-content:center; gap:10px; margin:22px 0 6px; font-family:Inter,Arial,sans-serif; }
  .chip { border:1.5px solid var(--border); background:#fff; border-radius:20px; padding:8px 20px; font-size:14px; cursor:pointer; color:var(--muted); }
  .chip.on { border-color:var(--purpl); background:var(--purpl); color:#fff; }
  .chip.on.lf { border-color:var(--lf); background:var(--lf); }
  .count { text-align:center; font-family:Inter,Arial,sans-serif; font-size:14px; color:var(--muted); margin:10px 0 18px; }
  #map { width:100%; height:420px; border-radius:12px; border:1px solid var(--border); background:#eef; display:none; }
  .state-hdr { font-family:Inter,Arial,sans-serif; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--purpl-dark); margin:22px 0 8px; border-bottom:2px solid var(--purpl); padding-bottom:5px; }
  .srow { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-bottom:6px; font-family:Inter,Arial,sans-serif; font-size:14px; flex-wrap:wrap; }
  .srow .nm { font-weight:600; }
  .srow .ad { color:var(--muted); font-size:12.5px; flex:1; min-width:130px; }
  .srow .icons { font-size:14px; letter-spacing:2px; }
  .srow .dir { margin-left:auto; font-size:13px; color:var(--purpl); text-decoration:none; font-weight:500; white-space:nowrap; }
  .empty { text-align:center; color:var(--muted); font-family:Inter,Arial,sans-serif; padding:50px 0; }
  .foot { text-align:center; font-family:Inter,Arial,sans-serif; font-size:12px; color:var(--muted); padding:30px 16px 50px; line-height:1.8; }
  .foot a { color:var(--purpl); text-decoration:none; }
</style>
</head>
<body>

<div class="hdr">
  <div class="logos">
    <img src="https://purpl-crm.web.app/images/purpl-wordmark-white.png" alt="purpl" width="150" height="58" style="display:block">
    <div class="divider"></div>
    <img src="https://purpl-crm.web.app/images/lf-logo-white.png" alt="Lavender Fields" width="74" height="69" style="display:block">
  </div>
  <h1 id="page-title">Where to Find Us</h1>
  <div class="sub">purpl lavender lemonade &amp; Lavender Fields farm products · Pumpkin Blossom Farm, Warner NH</div>
</div>

<div class="wrap">
  <div class="chips">
    <button class="chip" data-brand="all" onclick="setBrand('all')">All</button>
    <button class="chip" data-brand="purpl" onclick="setBrand('purpl')">💜 purpl</button>
    <button class="chip" data-brand="lf" onclick="setBrand('lf')">🪻 Lavender Fields</button>
  </div>
  <div class="count" id="count">Loading stores…</div>
  <div id="maplegend" style="display:none;justify-content:center;gap:18px;font-family:Inter,Arial,sans-serif;font-size:13px;color:#374151;margin-bottom:10px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#8B5FBF;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> purpl</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#4a7c59;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> Lavender Fields</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,#8B5FBF 50%,#4a7c59 50%);border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> carries both</span>
  </div>
  <div id="map"></div>
  <div id="list"></div>
</div>

<div class="foot">
  Pumpkin Blossom Farm · 393 Pumpkin Hill Rd, Warner, NH 03278<br>
  Interested in carrying us? <a href="https://pbfwholesale.com">Wholesale info &amp; application →</a>
</div>

<script>
// Embed mode (?embed=1): the wholesale homepage inlines this page as its
// "Where to Find Us" section via iframe — hide the hero header and footer so
// it reads as part of that page, not a page within a page.
if (new URLSearchParams(location.search).get('embed')) {
  document.querySelector('.hdr').style.display = 'none';
  document.querySelector('.foot').style.display = 'none';
  document.body.style.background = 'transparent';
}
firebase.initializeApp(window.FIREBASE_CONFIG);
var ALL = [];            // full stockist list from the server
var SKIPPED = 0;         // entries held back server-side (no coordinates yet)
var BRAND = 'all';       // current filter
var MAP = null, MARKERS = [], INFO = null;

// URL param drives the initial filter (Wix links use ?brand=purpl / ?brand=lf)
(function () {
  var b = new URLSearchParams(location.search).get('brand');
  if (b === 'purpl' || b === 'lf') BRAND = b;
})();

function visible() {
  return BRAND === 'all' ? ALL : ALL.filter(function (s) { return (s.brands || []).indexOf(BRAND) >= 0; });
}

function stateOf(s) {
  var m = (s.address || '').match(/\b(NH|MA|ME|VT|CT|RI|NY)\b/);
  return m ? m[1] : 'More';
}

// "Town, ST" for the compact rows (full address stays in the tooltip and
// the Directions link)
function townOf(s) {
  var parts = (s.address || '').split(',');
  if (parts.length >= 2) {
    var town = parts[parts.length - 2].replace(/\b(NH|MA|ME|VT|CT|RI|NY)\b|\d{5}(-\d{4})?/g, '').trim();
    if (!town && parts.length >= 3) town = parts[parts.length - 3].trim();
    var st = stateOf(s);
    return town ? town + (st !== 'More' ? ', ' + st : '') : (s.address || '');
  }
  return s.address || '';
}
var STATE_NAMES = { NH:'New Hampshire', MA:'Massachusetts', ME:'Maine', VT:'Vermont', CT:'Connecticut', RI:'Rhode Island', NY:'New York', More:'More locations' };
var STATE_ORDER = ['NH','MA','ME','VT','CT','RI','NY','More'];

function render() {
  // chips
  document.querySelectorAll('.chip').forEach(function (c) {
    c.classList.toggle('on', c.dataset.brand === BRAND);
    c.classList.toggle('lf', c.dataset.brand === 'lf' && BRAND === 'lf');
  });
  document.getElementById('page-title').textContent =
    BRAND === 'purpl' ? 'Where to Find purpl' : BRAND === 'lf' ? 'Where to Find Lavender Fields' : 'Where to Find Us';

  var list = visible();
  document.getElementById('count').textContent = (list.length
    ? 'Available at ' + list.length + ' location' + (list.length === 1 ? '' : 's') + ' across New England'
    : 'Store list coming soon — check back shortly!')
    + (SKIPPED > 0 ? ' (+' + SKIPPED + ' more being located)' : '');

  // grouped cards
  var groups = {};
  list.forEach(function (s) { var st = stateOf(s); (groups[st] = groups[st] || []).push(s); });
  var html = '';
  STATE_ORDER.forEach(function (st) {
    if (!groups[st]) return;
    groups[st].sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    html += '<div class="state-hdr">' + (STATE_NAMES[st] || st) + ' (' + groups[st].length + ')</div>';
    groups[st].forEach(function (s) {
      var icons = ((s.brands || []).indexOf('purpl') >= 0 ? '<span title="purpl">💜</span>' : '') +
                  ((s.brands || []).indexOf('lf') >= 0 ? '<span title="Lavender Fields">🪻</span>' : '');
      html += '<div class="srow">' +
        '<span class="nm">' + esc(s.name) + '</span>' +
        '<span class="ad" title="' + esc(s.address || '') + '">' + esc(townOf(s)) + '</span>' +
        '<span class="icons">' + icons + '</span>' +
        '<a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(s.name + ' ' + (s.address || '')) + '">Directions →</a>' +
        '</div>';
    });
  });
  document.getElementById('list').innerHTML = html || '<div class="empty">No stores match this filter yet.</div>';

  renderPins(list);
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function setBrand(b) {
  BRAND = b;
  var url = new URL(location.href);
  if (b === 'all') url.searchParams.delete('brand'); else url.searchParams.set('brand', b);
  history.replaceState(null, '', url.toString());
  render();
}

// ── Map layer (enhancement — the list works without it) ──
function renderPins(list) {
  if (!MAP) return;
  MARKERS.forEach(function (m) { m.setMap(null); });
  MARKERS = [];
  if (!list.length) return;
  var bounds = new google.maps.LatLngBounds();
  // Half-purple/half-green split circle for stores carrying both brands
  var dualSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22">' +
    '<circle cx="11" cy="11" r="9" fill="#4a7c59"/>' +
    '<path d="M11 2 a9 9 0 0 0 0 18 Z" fill="#8B5FBF"/>' +
    '<circle cx="11" cy="11" r="9" fill="none" stroke="#fff" stroke-width="2.5"/></svg>';
  var DUAL_ICON = {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(dualSvg),
    scaledSize: new google.maps.Size(22, 22),
    anchor: new google.maps.Point(11, 11),
  };
  list.forEach(function (s) {
    var isP = (s.brands || []).indexOf('purpl') >= 0;
    var isL = (s.brands || []).indexOf('lf') >= 0;
    var icon = (isP && isL) ? DUAL_ICON
      : { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: isL ? '#4a7c59' : '#8B5FBF', fillOpacity: .95, strokeColor: '#fff', strokeWeight: 2 };
    var m = new google.maps.Marker({
      map: MAP, position: { lat: s.lat, lng: s.lng }, title: s.name,
      icon: icon,
    });
    m.addListener('click', function () {
      if (!INFO) INFO = new google.maps.InfoWindow();
      INFO.setContent('<div style="font-family:Arial,sans-serif;min-width:170px">' +
        '<div style="font-weight:700;font-size:14px;margin-bottom:3px">' + esc(s.name) + '</div>' +
        '<div style="font-size:12px;color:#666">' + esc(s.address || '') + '</div>' +
        '<div style="font-size:11px;margin-top:5px;color:#4B2082">' +
          (isP ? '💜 purpl ' : '') + (isL ? '🪻 Lavender Fields' : '') + '</div>' +
        '<a style="font-size:12px;color:#8B5FBF" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(s.name + ' ' + (s.address || '')) + '">Directions →</a></div>');
      INFO.open(MAP, m);
    });
    MARKERS.push(m);
    bounds.extend(m.getPosition());
  });
  MAP.fitBounds(bounds);
  if (list.length === 1) MAP.setZoom(13);
}

window.__findUsMapReady = function () {
  try {
    document.getElementById('map').style.display = 'block';
    document.getElementById('maplegend').style.display = 'flex';
    MAP = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 43.4, lng: -71.6 }, zoom: 8,
      mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
    });
    renderPins(visible());
  } catch (e) { /* list remains the product */ }
};

(function loadMap() {
  var KEY = window.GOOGLE_PLACES_KEY || '';
  if (!KEY) return;
  var s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + KEY + '&callback=__findUsMapReady';
  s.async = true; s.defer = true;
  s.onerror = function () { /* map stays hidden; list unaffected */ };
  document.head.appendChild(s);
})();

// ── Data ──
firebase.functions().httpsCallable('getStockists')({})
  .then(function (r) {
    ALL = (r.data && r.data.stockists) || [];
    SKIPPED = (r.data && r.data.skipped) || 0;
    render();
  })
  .catch(function (e) {
    console.error(e);
    document.getElementById('count').textContent = 'Store list is taking a moment — please refresh.';
  });
</script>
</body>
</html>
