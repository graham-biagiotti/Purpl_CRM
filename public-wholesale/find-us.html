<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to Find Us — purpl &amp; Lavender Fields</title>
<meta name="description" content="Stores across New England carrying purpl lavender lemonade and Lavender Fields farm products from Pumpkin Blossom Farm.">
<link rel="icon" href="images/favicon-32.png">
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root { --purpl:#8B5FBF; --purpl-dark:#4B2082; --lf:#4a7c59; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Georgia,'Times New Roman',serif; background:#faf9f7; color:var(--text); }
  .hdr { background:linear-gradient(135deg,#6B4F9A 0%,#9B73C4 100%); padding:36px 20px 30px; text-align:center; color:#fff; }
  .hdr .logos { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
  .hdr .logos .divider { width:1px; height:44px; background:rgba(255,255,255,.5); }
  .hdr h1 { font-size:30px; font-weight:600; letter-spacing:.5px; }
  .hdr .sub { font-family:Inter,Arial,sans-serif; font-size:14px; opacity:.92; margin-top:8px; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px 60px; }
  .chips { display:flex; justify-content:center; gap:12px; margin:22px 0 6px; font-family:Inter,Arial,sans-serif; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:9px; border:2px solid var(--border); background:#fff; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; color:var(--text); }
  .chip img { height:22px; width:auto; display:block; }
  .chip.on { border-color:var(--purpl); background:#faf5ff; box-shadow:0 0 0 1px var(--purpl); }
  .chip.on.lf { border-color:var(--lf); background:#f0fdf4; box-shadow:0 0 0 1px var(--lf); }
  .bl { height:15px; width:auto; vertical-align:-2px; }
  .count { text-align:center; font-family:Inter,Arial,sans-serif; font-size:14px; color:var(--muted); margin:10px 0 18px; }
  #map { width:100%; height:560px; border-radius:12px; border:1px solid var(--border); background:#eef; display:none; }
  @media (max-width:640px) { #map { height:420px; } }
  .state-hdr { font-family:Inter,Arial,sans-serif; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--purpl-dark); margin:22px 0 8px; border-bottom:2px solid var(--purpl); padding-bottom:5px; }
  .srow { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-bottom:6px; font-family:Inter,Arial,sans-serif; font-size:14px; flex-wrap:wrap; }
  .srow .nm { font-weight:600; }
  .srow .ad { color:var(--muted); font-size:12.5px; flex:1; min-width:130px; }
  .srow .icons { font-size:14px; letter-spacing:2px; }
  .srow .dir { margin-left:auto; font-size:13px; color:var(--purpl); text-decoration:none; font-weight:500; white-space:nowrap; }
  .srow .mi { font-size:12.5px; font-weight:700; color:var(--purpl-dark); white-space:nowrap; }
  .searchbar { display:flex; gap:8px; max-width:520px; margin:0 auto 16px; font-family:Inter,Arial,sans-serif; }
  .searchbar input { flex:1; padding:11px 16px; font-size:15px; border:1.5px solid var(--border); border-radius:8px; outline:none; font-family:inherit; }
  .searchbar input:focus { border-color:var(--purpl); }
  .searchbar button { padding:11px 18px; font-size:14px; border:none; border-radius:8px; background:var(--purpl); color:#fff; cursor:pointer; font-weight:600; font-family:inherit; }
  .searchbar .geo { background:#fff; border:1.5px solid var(--border); color:var(--text); font-size:16px; padding:11px 13px; }
  .results-hdr { font-family:Inter,Arial,sans-serif; font-size:14px; color:var(--text); margin:18px 0 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .results-hdr .clr { font-size:12.5px; color:var(--muted); cursor:pointer; text-decoration:underline; }
  .morebtn { display:block; margin:10px auto 0; padding:9px 22px; font-family:Inter,Arial,sans-serif; font-size:13.5px; border:1.5px solid var(--purpl); background:#fff; color:var(--purpl-dark); border-radius:8px; cursor:pointer; font-weight:600; }
  .shipnote { font-family:Inter,Arial,sans-serif; font-size:13.5px; color:#374151; background:#faf5ff; border:1px solid #e9d5ff; border-radius:8px; padding:12px 16px; margin:14px 0; text-align:center; }
  .shipnote a { color:var(--purpl-dark); font-weight:600; text-decoration:none; }
  .browse-toggle { text-align:center; margin:26px 0 8px; font-family:Inter,Arial,sans-serif; }
  .browse-toggle a { font-size:13.5px; color:var(--muted); cursor:pointer; text-decoration:underline; }
  .empty { text-align:center; color:var(--muted); font-family:Inter,Arial,sans-serif; padding:50px 0; }
  .foot { text-align:center; font-family:Inter,Arial,sans-serif; font-size:12px; color:var(--muted); padding:30px 16px 50px; line-height:1.8; }
  .foot a { color:var(--purpl); text-decoration:none; }
</style>
</head>
<body>

<div class="hdr">
  <div class="logos">
    <img src="https://purpl-crm.web.app/images/purpl-wordmark-white.png" alt="purpl" width="150" height="58" style="display:block">
    <div class="divider"></div>
    <img src="https://purpl-crm.web.app/images/lf-logo-white.png" alt="Lavender Fields" width="74" height="69" style="display:block">
  </div>
  <h1 id="page-title">Where to Find Us</h1>
  <div class="sub">purpl lavender lemonade &amp; Lavender Fields farm products · Pumpkin Blossom Farm, Warner NH</div>
</div>

<div class="wrap">
  <div class="chips">
    <button class="chip" data-brand="all" onclick="setBrand('all')">All products</button>
    <button class="chip" data-brand="purpl" onclick="setBrand('purpl')"><img src="https://purpl-crm.web.app/images/purpl-logo-top-sprig.png" alt="purpl"></button>
    <button class="chip" data-brand="lf" onclick="setBrand('lf')"><img src="https://purpl-crm.web.app/images/lf-logo-circle-transparent.png" alt="Lavender Fields" style="border-radius:50%"> Lavender Fields</button>
  </div>
  <div class="count" id="count">Loading stores…</div>
  <div class="searchbar">
    <input id="loc-input" placeholder="Enter your town or ZIP…" autocomplete="postal-code"
      onkeydown="if(event.key==='Enter')searchLocation()">
    <button onclick="searchLocation()">Search</button>
    <button class="geo" onclick="useMyLocation()" title="Use my location">📍</button>
  </div>
  <div id="maplegend" style="display:none;justify-content:center;gap:18px;font-family:Inter,Arial,sans-serif;font-size:13px;color:#374151;margin-bottom:10px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#8B5FBF;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> purpl</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:#4a7c59;border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> Lavender Fields</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,#8B5FBF 50%,#4a7c59 50%);border:2px solid #fff;box-shadow:0 0 0 1px #ccc"></span> carries both</span>
  </div>
  <div id="map"></div>
  <div id="list"></div>
</div>

<div class="foot">
  Pumpkin Blossom Farm · 393 Pumpkin Hill Rd, Warner, NH 03278<br>
  Interested in carrying us? <a href="https://pbfwholesale.com">Wholesale info &amp; application →</a>
</div>

<script>
// Embed mode (?embed=1): the wholesale homepage inlines this page as its
// "Where to Find Us" section via iframe — hide the hero header and footer so
// it reads as part of that page, not a page within a page.
if (new URLSearchParams(location.search).get('embed')) {
  document.querySelector('.hdr').style.display = 'none';
  document.querySelector('.foot').style.display = 'none';
  document.body.style.background = 'transparent';
}
firebase.initializeApp(window.FIREBASE_CONFIG);
var ALL = [];            // full stockist list from the server
var SKIPPED = 0;         // entries held back server-side (no coordinates yet)
var BRAND = 'all';       // current filter
var SEARCH = null;       // {lat, lng, label} once the visitor searches
var SHOWN = 10;          // nearest-results page size
var BROWSE = false;      // collapsed browse-all expanded?
var MAP = null, MARKERS = [], INFO = null, YOU_MARKER = null;

// miles between two points
function milesBetween(lat1, lng1, lat2, lng2) {
  var p = Math.PI / 180, R = 3958.8;
  var h = Math.pow(Math.sin((lat2 - lat1) * p / 2), 2) +
    Math.cos(lat1 * p) * Math.cos(lat2 * p) * Math.pow(Math.sin((lng2 - lng1) * p / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

// URL param drives the initial filter (Wix links use ?brand=purpl / ?brand=lf)
(function () {
  var b = new URLSearchParams(location.search).get('brand');
  if (b === 'purpl' || b === 'lf') BRAND = b;
})();

function visible() {
  return BRAND === 'all' ? ALL : ALL.filter(function (s) { return (s.brands || []).indexOf(BRAND) >= 0; });
}

function stateOf(s) {
  var m = (s.address || '').match(/\b(NH|MA|ME|VT|CT|RI|NY)\b/);
  return m ? m[1] : 'More';
}

// "Town, ST" for the compact rows (full address stays in the tooltip and
// the Directions link)
function townOf(s) {
  var parts = (s.address || '').split(',');
  if (parts.length >= 2) {
    var town = parts[parts.length - 2].replace(/\b(NH|MA|ME|VT|CT|RI|NY)\b|\d{5}(-\d{4})?/g, '').trim();
    if (!town && parts.length >= 3) town = parts[parts.length - 3].trim();
    var st = stateOf(s);
    return town ? town + (st !== 'More' ? ', ' + st : '') : (s.address || '');
  }
  return s.address || '';
}
var STATE_NAMES = { NH:'New Hampshire', MA:'Massachusetts', ME:'Maine', VT:'Vermont', CT:'Connecticut', RI:'Rhode Island', NY:'New York', More:'More locations' };
var STATE_ORDER = ['NH','MA','ME','VT','CT','RI','NY','More'];

function render() {
  // chips
  document.querySelectorAll('.chip').forEach(function (c) {
    c.classList.toggle('on', c.dataset.brand === BRAND);
    c.classList.toggle('lf', c.dataset.brand === 'lf' && BRAND === 'lf');
  });
  document.getElementById('page-title').textContent =
    BRAND === 'purpl' ? 'Where to Find purpl' : BRAND === 'lf' ? 'Where to Find Lavender Fields' : 'Where to Find Us';

  var list = visible();
  document.getElementById('count').textContent = (list.length
    ? 'Available at ' + list.length + ' location' + (list.length === 1 ? '' : 's') + ' across New England'
    : 'Store list coming soon — check back shortly!')
    + (SKIPPED > 0 ? ' (+' + SKIPPED + ' more being located)' : '');

  var html = '';

  if (SEARCH) {
    var ranked = list.map(function (s) {
      return { s: s, d: milesBetween(SEARCH.lat, SEARCH.lng, s.lat, s.lng) };
    }).sort(function (a, b) { return a.d - b.d; });
    var shown = ranked.slice(0, SHOWN);
    html += '<div class="results-hdr"><strong>' + (shown.length ? 'Stores near ' + esc(SEARCH.label) : 'No stores found near ' + esc(SEARCH.label)) + '</strong>' +
      '<span class="clr" onclick="clearSearch()">✕ clear search</span></div>';
    if (shown.length && shown[0].d > 50) {
      var links = BRAND === 'purpl' ? '<a href="https://drinkpurpl.com" target="_blank" rel="noopener">drinkpurpl.com</a>'
        : BRAND === 'lf' ? '<a href="https://pumpkinblossomfarm.com" target="_blank" rel="noopener">pumpkinblossomfarm.com</a>'
        : '<a href="https://drinkpurpl.com" target="_blank" rel="noopener">drinkpurpl.com</a> · <a href="https://pumpkinblossomfarm.com" target="_blank" rel="noopener">pumpkinblossomfarm.com</a>';
      html += '<div class="shipnote">We\'re still growing toward you — but we ship! ' + links + '</div>';
    }
    shown.forEach(function (r) { html += rowHtml(r.s, r.d); });
    if (ranked.length > SHOWN) html += '<button class="morebtn" onclick="SHOWN+=10;render()">Show more</button>';
  }

  // Collapsed browse-all (SEO + skimmers) — always available at the bottom
  html += '<div class="browse-toggle"><a onclick="BROWSE=!BROWSE;render()">' +
    (BROWSE ? 'Hide full store list ▴' : 'Browse all locations ▾') + '</a></div>';
  if (BROWSE) {
    var groups = {};
    list.forEach(function (s) { var st = stateOf(s); (groups[st] = groups[st] || []).push(s); });
    STATE_ORDER.forEach(function (st) {
      if (!groups[st]) return;
      groups[st].sort(function (a, b) { return a.name < b.name ? -1 : 1; });
      html += '<div class="state-hdr">' + (STATE_NAMES[st] || st) + ' (' + groups[st].length + ')</div>';
      groups[st].forEach(function (s) { html += rowHtml(s, null); });
    });
    if (!list.length) html += '<div class="empty">No stores match this filter yet.</div>';
  }

  document.getElementById('list').innerHTML = html;
  renderPins(list);
  applySearchToMap();
}

function brandTiles(s) {
  return ((s.brands || []).indexOf('purpl') >= 0 ? '<img class="bl" src="https://purpl-crm.web.app/images/purpl-logo-top-sprig.png" alt="purpl" title="purpl"> ' : '') +
         ((s.brands || []).indexOf('lf') >= 0 ? '<img class="bl" src="https://purpl-crm.web.app/images/lf-logo-circle-transparent.png" alt="Lavender Fields" title="Lavender Fields" style="border-radius:50%">' : '');
}

function rowHtml(s, dist) {
  var icons = brandTiles(s);
  return '<div class="srow">' +
    '<span class="nm">' + esc(s.name) + '</span>' +
    '<span class="ad" title="' + esc(s.address || '') + '">' + esc(townOf(s)) + '</span>' +
    '<span class="icons">' + icons + '</span>' +
    (dist != null ? '<span class="mi">' + (dist < 10 ? dist.toFixed(1) : Math.round(dist)) + ' mi</span>' : '') +
    '<a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(s.name + ' ' + (s.address || '')) + '">Directions →</a>' +
    '</div>';
}

function searchLocation() {
  var q = (document.getElementById('loc-input').value || '').trim();
  if (!q) return;
  if (typeof google === 'undefined' || !google.maps || !google.maps.Geocoder) {
    BROWSE = true; render();
    document.getElementById('count').textContent = 'Search is unavailable right now — browse the full list below.';
    return;
  }
  var geocoder = new google.maps.Geocoder();
  var isZip = /^\d{5}(-\d{4})?$/.test(q);
  // ZIPs need the postalCode component; free-text town names use address.
  // Whichever ran first, fall back to the other shape before giving up.
  var attempts = isZip
    ? [{ componentRestrictions: { country: 'US', postalCode: q.slice(0, 5) } }, { address: q + ', USA' }]
    : [{ address: q, componentRestrictions: { country: 'US' } }, { address: q + ', New England, USA' }];
  var tryNext = function (i) {
    if (i >= attempts.length) {
      document.getElementById('count').textContent = 'Couldn\'t find "' + q + '" — try a town name or a 5-digit ZIP.';
      return;
    }
    geocoder.geocode(attempts[i], function (res, status) {
      if (status === 'OK' && res && res[0]) {
        var loc = res[0].geometry.location;
        SEARCH = { lat: loc.lat(), lng: loc.lng(), label: q };
        SHOWN = 10;
        render();
      } else tryNext(i + 1);
    });
  };
  tryNext(0);
}

function useMyLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function (pos) {
    SEARCH = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'your location' };
    SHOWN = 10;
    render();
  }, function () {
    document.getElementById('count').textContent = 'Location unavailable — type your town or ZIP instead.';
  });
}

function clearSearch() {
  SEARCH = null; SHOWN = 10;
  document.getElementById('loc-input').value = '';
  render();
  if (MAP && MARKERS.length) {
    var b = new google.maps.LatLngBounds();
    MARKERS.forEach(function (m) { b.extend(m.getPosition()); });
    MAP.fitBounds(b);
  }
}

function applySearchToMap() {
  if (!MAP) return;
  if (YOU_MARKER) { YOU_MARKER.setMap(null); YOU_MARKER = null; }
  if (!SEARCH) return;
  YOU_MARKER = new google.maps.Marker({
    map: MAP, position: { lat: SEARCH.lat, lng: SEARCH.lng }, title: 'You',
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: '#2563eb', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
    zIndex: 999,
  });
  MAP.setCenter({ lat: SEARCH.lat, lng: SEARCH.lng });
  MAP.setZoom(10);
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function setBrand(b) {
  BRAND = b;
  var url = new URL(location.href);
  if (b === 'all') url.searchParams.delete('brand'); else url.searchParams.set('brand', b);
  history.replaceState(null, '', url.toString());
  render();
}

// ── Map layer (enhancement — the list works without it) ──
function renderPins(list) {
  if (!MAP) return;
  MARKERS.forEach(function (m) { m.setMap(null); });
  MARKERS = [];
  if (!list.length) return;
  var bounds = new google.maps.LatLngBounds();
  // Half-purple/half-green split circle for stores carrying both brands
  var dualSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22">' +
    '<circle cx="11" cy="11" r="9" fill="#4a7c59"/>' +
    '<path d="M11 2 a9 9 0 0 0 0 18 Z" fill="#8B5FBF"/>' +
    '<circle cx="11" cy="11" r="9" fill="none" stroke="#fff" stroke-width="2.5"/></svg>';
  var DUAL_ICON = {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(dualSvg),
    scaledSize: new google.maps.Size(22, 22),
    anchor: new google.maps.Point(11, 11),
  };
  list.forEach(function (s) {
    var isP = (s.brands || []).indexOf('purpl') >= 0;
    var isL = (s.brands || []).indexOf('lf') >= 0;
    var icon = (isP && isL) ? DUAL_ICON
      : { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: isL ? '#4a7c59' : '#8B5FBF', fillOpacity: .95, strokeColor: '#fff', strokeWeight: 2 };
    var m = new google.maps.Marker({
      map: MAP, position: { lat: s.lat, lng: s.lng }, title: s.name,
      icon: icon,
    });
    m.addListener('click', function () {
      if (!INFO) INFO = new google.maps.InfoWindow();
      INFO.setContent('<div style="font-family:Arial,sans-serif;min-width:170px">' +
        '<div style="font-weight:700;font-size:14px;margin-bottom:3px">' + esc(s.name) + '</div>' +
        '<div style="font-size:12px;color:#666">' + esc(s.address || '') + '</div>' +
        '<div style="margin-top:6px">' + brandTiles(s) + '</div>' +
        '<a style="font-size:12px;color:#8B5FBF" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(s.name + ' ' + (s.address || '')) + '">Directions →</a></div>');
      INFO.open(MAP, m);
    });
    MARKERS.push(m);
    bounds.extend(m.getPosition());
  });
  if (!SEARCH) {
    MAP.fitBounds(bounds);
    if (list.length === 1) MAP.setZoom(13);
  }
}

window.__findUsMapReady = function () {
  try {
    document.getElementById('map').style.display = 'block';
    document.getElementById('maplegend').style.display = 'flex';
    MAP = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 43.4, lng: -71.6 }, zoom: 8,
      mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
    });
    renderPins(visible());
    applySearchToMap();
  } catch (e) { /* list remains the product */ }
};

(function loadMap() {
  var KEY = window.GOOGLE_PLACES_KEY || '';
  if (!KEY) return;
  var s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + KEY + '&callback=__findUsMapReady';
  s.async = true; s.defer = true;
  s.onerror = function () { /* map stays hidden; list unaffected */ };
  document.head.appendChild(s);
})();

// ── Data ──
firebase.functions().httpsCallable('getStockists')({})
  .then(function (r) {
    ALL = (r.data && r.data.stockists) || [];
    SKIPPED = (r.data && r.data.skipped) || 0;
    render();
  })
  .catch(function (e) {
    console.error(e);
    document.getElementById('count').textContent = 'Store list is taking a moment — please refresh.';
  });
</script>
</body>
</html>
