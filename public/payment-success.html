<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment — Pumpkin Blossom Farm</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f5f5f7;color:#1a1a2e;display:flex;align-items:center;
      justify-content:center;min-height:100vh;padding:24px}
    .card{background:#fff;border-radius:14px;max-width:480px;width:100%;
      text-align:center;box-shadow:0 8px 40px rgba(20,10,40,.12);overflow:hidden}
    .header{padding:32px 40px 20px;background:linear-gradient(135deg,#2D1B4E,#4a2d7a)}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:14px}
    .logo-row img{display:block}
    .divider{width:1px;height:40px;background:rgba(255,255,255,.3)}
    .farm-name{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.14em;
      text-transform:uppercase;margin-top:10px}
    .body{padding:32px 40px 40px}
    .icon{font-size:48px;margin-bottom:16px;line-height:1}
    h1{font-size:22px;font-weight:700;margin-bottom:8px}
    .sub{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:20px}
    .inv-num{display:inline-block;background:#f3f4f6;border-radius:6px;
      padding:4px 14px;font-size:13px;font-weight:600;color:#4b5563;
      letter-spacing:.03em;margin-bottom:24px}
    .info{font-size:12.5px;color:#9ca3af;line-height:1.7}
    .info a{color:#7B4FA0;text-decoration:none}
    .footer{background:#fafafa;padding:16px 40px;border-top:1px solid #e5e7eb;
      font-size:11px;color:#9ca3af;line-height:1.7}

    .cancelled h1{color:#92400e}
    .cancelled .icon-wrap{background:#fef3c7;border:2px solid #fcd34d}
    .paid .icon-wrap{background:#dcfce7;border:2px solid #86efac}
    .icon-wrap{width:72px;height:72px;border-radius:50%;display:inline-flex;
      align-items:center;justify-content:center;margin-bottom:18px}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="header">
      <div class="logo-row">
        <img src="https://static.wixstatic.com/media/81a2ff_1e3f6923c1d5495082d490b4cc229e1c~mv2.png/v1/fill/w_176,h_71,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Purpl%20Logo%20-%20Sprig%20in%20front%20-%20transparent.png"
          alt="purpl" width="120" height="48" style="filter:brightness(0) invert(1)">
        <div class="divider"></div>
        <img src="https://purpl-crm.web.app/images/lf-logo-circle-transparent.png"
          alt="Lavender Fields" width="48" height="48" style="filter:brightness(0) invert(1)">
      </div>
      <div class="farm-name">Pumpkin Blossom Farm · Wholesale</div>
    </div>
    <div class="body" id="body-content"></div>
    <div class="footer">
      Pumpkin Blossom Farm LLC · 393 Pumpkin Hill Rd · Warner, NH 03278<br>
      <a href="mailto:lavender@pbfwholesale.com" style="color:#7B4FA0;text-decoration:none">lavender@pbfwholesale.com</a> · 603-748-3038
    </div>
  </div>
  <script>
    var p = new URLSearchParams(window.location.search);
    var inv = p.get('inv') || '';
    var cancelled = p.get('cancelled') === '1';
    var el = document.getElementById('body-content');
    var card = document.getElementById('card');
    if (cancelled) {
      card.classList.add('cancelled');
      el.innerHTML =
        '<div class="icon-wrap"><span class="icon">↩</span></div>' +
        '<h1>Payment Cancelled</h1>' +
        (inv ? '<div class="inv-num">' + inv + '</div>' : '') +
        '<div class="sub">No charge was made. Your invoice is still open — you can pay anytime using the link in your invoice email.</div>' +
        '<div class="info">Questions? Email <a href="mailto:lavender@pbfwholesale.com">lavender@pbfwholesale.com</a> or call 603-748-3038.</div>';
    } else {
      card.classList.add('paid');
      el.innerHTML =
        '<div class="icon-wrap"><span class="icon">✓</span></div>' +
        '<h1>Payment Received</h1>' +
        (inv ? '<div class="inv-num">' + inv + '</div>' : '') +
        '<div class="sub">Thank you! Your payment has been processed. A receipt from Stripe has been emailed to you, and your invoice is being marked as paid.</div>' +
        '<div class="info">Questions? Email <a href="mailto:lavender@pbfwholesale.com">lavender@pbfwholesale.com</a> or call 603-748-3038.</div>';
    }
  </script>
</body>
</html>
